components:
  schemas:
    User:
      type: object
      properties:
        username: { type: string }
        password_hash: { type: string }
        email: { type: string }
        role: { type: string }
        first_name: { type: string }
        last_name: { type: string }
    Supplier:
      type: object
      properties:
        supplier_name: { type: string }
        address: { type: string }
        contact_person: { type: string }
        phone_number: { type: string }
        email: { type: string }
        payment_status: { type: string }
    Ingredient:
      type: object
      properties:
        item_name: { type: string }
        category: { type: string }
        unit_of_measure: { type: string }
        unit_cost: { type: number }
        reorder_level: { type: number }
        alert_threshold: { type: number }
        batch_tracking_enabled: { type: boolean }
        expiry_tracking_enabled: { type: boolean }
    PurchaseOrder:
      type: object
      properties:
        supplier_id: { type: string }
        order_date: { type: string, format: date }
        status: { type: string }
        created_by_user_id: { type: string }
    PurchaseOrderItem:
      type: object
      properties:
        po_id: { type: string }
        item_id: { type: string }
        quantity_ordered: { type: number }
        unit_cost_at_order: { type: number }
    GRV:
      type: object
      properties:
        po_id: { type: string }
        supplier_id: { type: string }
        delivery_date: { type: string, format: date }
        received_by_user_id: { type: string }
        is_backdated: { type: boolean }
        backdate_reason: { type: string }
        status: { type: string }
    GRVItem:
      type: object
      properties:
        grv_id: { type: string }
        item_id: { type: string }
        quantity_received: { type: number }
        discrepancy_flag: { type: boolean }
        discrepancy_details: { type: string }
    StockLedger:
      type: object
      properties:
        item_id: { type: string }
        transaction_type: { type: string }
        quantity_change: { type: number }
        date_of_transaction: { type: string, format: date }
        cost_per_unit_at_transaction: { type: number }
        user_id: { type: string }
    ProductionBatch:
      type: object
      properties:
        production_date: { type: string, format: date }
        number_of_bakes: { type: number }
        formula_used: { type: string }
        production_manager_user_id: { type: string }
        output_loaves: { type: number }
        shift: { type: string }
        bakery_damages: { type: number }
    ProductionBatchIngredient:
      type: object
      properties:
        production_batch_id: { type: string }
        item_id: { type: string }
        quantity_used: { type: number }
    Driver:
      type: object
      properties:
        driver_name: { type: string }
        employee_id: { type: string }
        commission_rate_per_loaf: { type: number }
    Truck:
      type: object
      properties:
        truck_number: { type: string }
        license_plate: { type: string }
        route_assigned: { type: string }
    DriverDelivery:
      type: object
      properties:
        driver_id: { type: string }
        truck_id: { type: string }
        delivery_date: { type: string, format: date }
        route_name: { type: string }
        total_loaves_loaded: { type: number }
        total_loaves_returned: { type: number }
        expected_revenue: { type: number }
        actual_cash_received: { type: number }
        discrepancy_alert: { type: boolean }
        finance_officer_user_id: { type: string }
    DriverDeliveryItem:
      type: object
      properties:
        delivery_id: { type: string }
        bread_type: { type: string }
        quantity_loaded: { type: number }
        quantity_returned: { type: number }
        unit_price: { type: number }
        quantity_sold: { type: number }
        revenue_for_type: { type: number }
        commission_earned: { type: number }
        is_damaged: { type: boolean }
        is_shortage: { type: boolean }
    DieselLog:
      type: object
      properties:
        date_of_issue: { type: string, format: date }
        driver_id: { type: string }
        truck_id: { type: string }
        route_or_destination: { type: string }
        litres_issued: { type: number }
        diesel_price_per_litre: { type: number }
        total_cost: { type: number }
        notes: { type: string }
        captured_by_user_id: { type: string }
        linked_delivery_id: { type: string }
    Expense:
      type: object
      properties:
        date_of_expense: { type: string, format: date }
        description: { type: string }
        amount: { type: number }
        payment_method: { type: string }
        supplier_name: { type: string }
        expense_category: { type: string }
        sub_category: { type: string }
        branch_id: { type: string }
        truck_id: { type: string }
        recorded_by_user_id: { type: string }
        receipt_attachment_path: { type: string }
        is_flagged_for_review: { type: boolean }
    Customer:
      type: object
      properties:
        customer_code: { type: string }
        full_name_or_business_name: { type: string }
        customer_type: { type: string }
        contact_person: { type: string }
        phone_number: { type: string }
        delivery_address: { type: string }
        area: { type: string }
        route_id: { type: string }
        payment_terms: { type: string }
        opening_balance: { type: number }
        notes: { type: string }
        is_inactive: { type: boolean }
    CustomerPriceList:
      type: object
      properties:
        customer_id: { type: string }
        item_id: { type: string }
        unit_price: { type: number }
        discount_percentage: { type: number }
    Invoice:
      type: object
      properties:
        invoice_number: { type: string }
        customer_id: { type: string }
        delivery_date: { type: string, format: date }
        driver_id: { type: string }
        delivery_route: { type: string }
        payment_status: { type: string }
        payment_method: { type: string }
        total_amount: { type: number }
        discount_amount: { type: number }
        notes_or_reference: { type: string }
        created_by_user_id: { type: string }
        approved_by_user_id: { type: string }
        linked_delivery_id: { type: string }
        is_auto_generated: { type: boolean }
    InvoiceItem:
      type: object
      properties:
        invoice_id: { type: string }
        item_id: { type: string }
        quantity: { type: number }
        unit_price_at_sale: { type: number }
        line_total: { type: number }
        is_return: { type: boolean }
        is_damage: { type: boolean }
    Payment:
      type: object
      properties:
        invoice_id: { type: string }
        payment_date: { type: string, format: date }
        amount_paid: { type: number }
        payment_method: { type: string }
        recorded_by_user_id: { type: string }
    AuditLog:
      type: object
      properties:
        user_id: { type: string }
        action_type: { type: string }
        table_name: { type: string }
        record_id: { type: number }
        old_values: {}
        new_values: {}
        timestamp: { type: string, format: date-time }
    Formula:
      type: object
      properties:
        formula_name: { type: string }
        description: { type: string }
    FormulaIngredient:
      type: object
      properties:
        formula_id: { type: string }
        item_id: { type: string }
        quantity_per_bake: { type: number }
        unit_of_measure: { type: string }
